[package]
name = "malt-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "OS abstractions for MALT — PTY, process spawning, signals, sockets"

[dependencies]
thiserror = "2"
tracing = "0.1"
malt-protocol = { path = "../malt-protocol" }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["process", "signal", "term", "ioctl", "fs", "sched", "mount", "net", "uio", "feature", "user"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Security_Cryptography",
    "Win32_System_JobObjects",
    "Win32_System_SystemServices",
] }

[features]
default = []
tokio = ["dep:tokio"]

[dependencies.tokio]
version = "1"
features = ["process", "signal", "net", "io-util", "sync"]
optional = true

[dev-dependencies]
tempfile = "3"
