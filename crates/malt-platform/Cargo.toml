[package]
name = "malt-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "OS abstractions for MALT — PTY, process spawning, signals, sockets"

[dependencies]
thiserror = "2"
tracing = "0.1"
malt-protocol = { path = "../malt-protocol" }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["process", "signal", "term", "ioctl", "fs", "sched", "mount", "net", "uio", "feature", "user"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Com",
    "Win32_System_Services",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_Security_Cryptography",
    "Win32_System_JobObjects",
    "Win32_System_SystemServices",
    "Win32_System_HostComputeSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
serde_json = "1"

[features]
default = []
tokio = ["dep:tokio"]
# Enables real Windows HCS (Host Compute System) container calls. Off by
# default: requires the Windows Containers feature installed on the host.
# Without it, HCS operations return IsolationError::HcsError("... unavailable
# on this build target"), and CARBOY_HCS_FAKE-style fake mode can still be
# used for testing (see isolation/hcs.rs).
hcs = []

[dependencies.tokio]
version = "1"
features = ["process", "signal", "net", "io-util", "sync"]
optional = true

[dev-dependencies]
tempfile = "3"
