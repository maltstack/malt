[package]
name = "maltty"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GPU terminal client for MALT — wgpu + cosmic-text + winit"

[[bin]]
name = "maltty"
path = "src/main.rs"

[dependencies]
wgpu = "24"
winit = "0.30"
cosmic-text = "0.12"
reqwest = { version = "0.13", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
pollster = "0.4"
