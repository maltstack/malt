[package]
name = "malt-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "HTTP REST API gateway for MALT"

[dependencies]
malt-protocol = { path = "../malt-protocol" }
axum = "0.8"
base64 = "0.22"
tokio = { version = "1", features = ["rt", "net", "sync", "macros"] }
tokio-stream = "0.1"
futures-core = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
thiserror = "2"
getrandom = "0.3"
tracing = "0.1"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
